spring.application.name=ratingService
server.port=8087

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/rating_db
# nécessaire pour l'index unique des évaluations
spring.data.mongodb.auto-index-creation=true

# Vérification de la course auprès du matching-service (désactivée pour l'instant)
rating.verify-course=false
rating.matching-service-url=http://localhost:8085

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health
