server:
  port: 8087

spring:
  application:
    name: rating-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/rating_db}
      auto-index-creation: true   # nécessaire pour l'index unique des évaluations

rating:
  jwt:
    # Même secret que celui utilisé par auth-service (HS256, minimum 32 caractères)
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  verify-course: ${VERIFY_COURSE:false}
  matching-service-url: ${MATCHING_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
