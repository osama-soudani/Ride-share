# === Serveur ===
server.port=8085
spring.application.name=payment-service

# === Base de données PostgreSQL ===
# En local, voir docker-compose.yml fourni pour lancer une instance PostgreSQL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
spring.datasource.username=postgres
spring.datasource.password=osama
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate : "update" est pratique en développement, à remplacer par des
# migrations Flyway/Liquibase avant la mise en production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# === Sécurité : validation des JWT émis par Keycloak ===
# Remplacer par l'URL réelle du realm Keycloak une fois le service déployé.
# Exemple : http://localhost:8080/realms/rideshare
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/rideshare}

# === Règle métier : taux de commission de la plateforme ===
# 0.10 = 10% prélevés sur le montant de chaque course.
commission.rate=${COMMISSION_RATE:0.10}

# === Actuator (santé du service, pour le Gateway / supervision) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
